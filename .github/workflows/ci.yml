name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Contracts
        working-directory: contracts
        run: |
          forge fmt --check
          forge build --sizes
          forge test -vv

      - name: MCP server
        working-directory: mcp
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Challenge
        working-directory: challenge
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
